name: Build

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      iosevka_base_version: ${{ steps.check.outputs.iosevka_base_version }}
      nf_version: ${{ steps.check.outputs.nf_version }}
    steps:
      - uses: actions/checkout@v6

      - id: check
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IOSEVKA_TAG=$(curl -fsSL -H "Authorization: Bearer $API_TOKEN" \
            "https://api.github.com/repos/be5invis/Iosevka/releases/latest" | jq -r .tag_name)
          NF_TAG=$(curl -fsSL -H "Authorization: Bearer $API_TOKEN" \
            "https://api.github.com/repos/ryanoasis/nerd-fonts/releases/latest" | jq -r .tag_name)

          case "$IOSEVKA_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected Iosevka tag: '${IOSEVKA_TAG}'"; exit 1 ;;
          esac
          case "$NF_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected Nerd Fonts tag: '${NF_TAG}'"; exit 1 ;;
          esac

          IOSEVKA_VERSION="${IOSEVKA_TAG#v}"
          NF_VERSION="${NF_TAG#v}"

          TAGS=$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk -F/ '{print $NF}')
          LATEST=$(printf '%s\n' "$TAGS" | sed -E 's/^v//; s/-[0-9]+$//' | sort -V | tail -1)
          LATEST="${LATEST:-0}"
          SUFFIX=$(printf '%s\n' "$TAGS" | sed -n "s/^v${IOSEVKA_VERSION//./\\.}-\\([1-9][0-9]*\\)$/\1/p" | sort -n | tail -1)

          FULL_VERSION="$IOSEVKA_VERSION"
          SHOULD_BUILD=false

          if [ "$IOSEVKA_VERSION" = "$LATEST" ]; then
            # Upstream unchanged: only a manual rerun may rebuild, with a suffix.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              SHOULD_BUILD=true
              FULL_VERSION="${IOSEVKA_VERSION}-$(( ${SUFFIX:-0} + 1 ))"
            fi
          elif [ "$(printf '%s\n%s\n' "$LATEST" "$IOSEVKA_VERSION" | sort -V | tail -1)" = "$IOSEVKA_VERSION" ]; then
            SHOULD_BUILD=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::upstream Iosevka v${IOSEVKA_VERSION} is older than the latest release (${LATEST})"
            exit 1
          fi

          {
            echo "should_build=${SHOULD_BUILD}"
            echo "tag=v${FULL_VERSION}"
            echo "version=${FULL_VERSION}"
            echo "iosevka_base_version=${IOSEVKA_VERSION}"
            echo "nf_version=${NF_VERSION}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      font_name: ${{ steps.resolve.outputs.font_name }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - id: resolve
        run: |
          REPO="${{ github.repository }}"
          IMG="${REGISTRY}/${REPO,,}:${{ needs.check.outputs.version }}"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          FONT_NAME=$(grep -m1 -oP '^\[buildPlans\.\K[^].]+(?=\])' private-build-plans.toml)
          echo "font_name=${FONT_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            IOSEVKA_VERSION=${{ needs.check.outputs.iosevka_base_version }}
            NF_VERSION=${{ needs.check.outputs.nf_version }}
          tags: ${{ steps.resolve.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  patch:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and patch
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          FONT_NAME: ${{ needs.build.outputs.font_name }}
          OUTPUT_DIR: ${{ github.workspace }}/_output
        run: |
          mkdir -p "$OUTPUT_DIR"
          docker run --rm -i -e FONT_NAME \
            -v "$(pwd)/private-build-plans.toml":/iosevka/private-build-plans.toml:ro \
            -v "$OUTPUT_DIR":/output \
            "$IMAGE" -s <<'EOS'
          set -e
          bun run build -- ttf::"$FONT_NAME"
          mkdir -p /output
          find "dist/$FONT_NAME/TTF" -name '*.ttf' | sort | while read -r f; do
            echo "Patching $f"
            fontforge -script /font-patcher/font-patcher "$f" --careful --makegroups 2 -s -q -c -l -out /output
          done
          n=$(find "dist/$FONT_NAME/TTF" -name '*.ttf' | wc -l)
          m=$(find /output -maxdepth 1 -name '*.ttf' | wc -l)
          echo "patched $m/$n"
          [ "$n" -gt 0 ]
          [ "$n" = "$m" ]
          [ -z "$(find /output -maxdepth 1 -name '*.ttf' -size -1000000c)" ]
          EOS

      - name: Zip
        env:
          FONT_NAME: ${{ needs.build.outputs.font_name }}
          VERSION: ${{ needs.check.outputs.version }}
          OUTPUT_DIR: ${{ github.workspace }}/_output
        run: |
          cp "${{ github.workspace }}/LICENSE" "$OUTPUT_DIR/LICENSE"
          cd "$OUTPUT_DIR"
          zip -r "${FONT_NAME}-${VERSION}.zip" ./*.ttf LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: font
          path: _output/${{ needs.build.outputs.font_name }}-${{ needs.check.outputs.version }}.zip

  release:
    needs: [check, build, patch]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: font
          path: _output

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          FONT_NAME: ${{ needs.build.outputs.font_name }}
          VERSION: ${{ needs.check.outputs.version }}
          IOSEVKA_BASE_VERSION: ${{ needs.check.outputs.iosevka_base_version }}
          NF_VERSION: ${{ needs.check.outputs.nf_version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -n "$CHANGELOG" ]; then
            printf '%s\n' "$CHANGELOG"
          else
            printf '[Iosevka v%s](https://github.com/be5invis/Iosevka/releases/tag/v%s)\n\n' \
              "$IOSEVKA_BASE_VERSION" "$IOSEVKA_BASE_VERSION"
            printf '%s\n\n' '---'
            printf 'Patched with [Nerd Fonts v%s](https://github.com/ryanoasis/nerd-fonts/releases/tag/v%s)\n' \
              "$NF_VERSION" "$NF_VERSION"
          fi | gh release create "$TAG" \
            "_output/${FONT_NAME}-${VERSION}.zip" \
            -R "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file - \
            --latest
